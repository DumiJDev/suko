# Descrições dos componentes da biblioteca, usadas pelo manifesto do
# registry (RegistryGenerator/GeneratorConfig#descriptionsFile). Chave =
# ComponentDecl.name() exato (não o nome em minúsculas do registry).
#
# Decisão do utilizador (2026-09-20, ver RegistryGenerator/GeneratorConfig):
# a descrição vem sempre daqui, nunca de comentários `//` no `.sk` -- não
# editar `registry.json`/`components/*.json` a partir daqui diretamente;
# mudar este ficheiro e correr `gradle :suko-components:generateRegistry`.
#
# Nota (correção da revisão final, ronda 1): RegistryGenerator.loadDescriptions
# agora lê este ficheiro explicitamente como UTF-8 (Properties.load(Reader)
# com um InputStreamReader em UTF-8), não mais Properties.load(InputStream)
# (que assumia ISO-8859-1 por contrato da API e corrompia acentos em
# silêncio). Os acentos portugueses abaixo são intencionais e saem corretos
# no manifesto gerado.
Button=Botão com variantes de estilo (primary, secondary, ghost) e estado desabilitado.
Input=Campo de entrada de texto simples, com placeholder e obrigatoriedade opcional.
Label=Rótulo de texto simples para um campo de formulário.
Badge=Etiqueta compacta com variantes de cor (success, warning, danger).
Alert=Caixa de aviso com variantes de cor (success, warning, danger) e conteúdo livre.
Card=Cartão com cabeçalho e rodapé opcionais, e conteúdo obrigatório.
Field=Label e input emparelhados, compostos a partir dos componentes Label e Input importados.
Dialog=Diálogo modal com Alpine.js para abrir/fechar, título e conteúdo livre.

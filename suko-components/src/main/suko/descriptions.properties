# Descricoes dos componentes da biblioteca, usadas pelo manifesto do
# registry (RegistryGenerator/GeneratorConfig#descriptionsFile). Chave =
# ComponentDecl.name() exato (nao o nome em minusculas do registry).
#
# Decisao do utilizador (2026-09-20, ver RegistryGenerator/GeneratorConfig):
# a descricao vem sempre daqui, nunca de comentarios `//` no `.sk` -- nao
# editar `registry.json`/`components/*.json` a partir daqui diretamente;
# mudar este ficheiro e correr `gradle :suko-components:generateRegistry`.
#
# Nota (Tarefa 9): sem acentos de proposito. RegistryGenerator.loadDescriptions
# le este ficheiro com Properties.load(InputStream), que assume ISO-8859-1
# por contrato da API Properties -- um caractere UTF-8 multibyte escrito
# aqui (ex. "a" com til) e lido byte-a-byte como Latin-1 e sai corrompido no
# manifesto ("Ã£o" em vez de "ão"), confirmado empiricamente ao gerar o
# manifesto real. Em vez de mudar o parsing de suko-registry (fora do
# escopo desta tarefa), este ficheiro evita o problema na origem.
Button=Botao com variantes de estilo (primary, secondary, ghost) e estado desabilitado.
Input=Campo de entrada de texto simples, com placeholder e obrigatoriedade opcional.
Label=Rotulo de texto simples para um campo de formulario.
Badge=Etiqueta compacta com variantes de cor (success, warning, danger).
Alert=Caixa de aviso com variantes de cor (success, warning, danger) e conteudo livre.
Card=Cartao com cabecalho e rodape opcionais, e conteudo obrigatorio.
Field=Label e input emparelhados, compostos a partir dos componentes Label e Input importados.
Dialog=Dialogo modal com Alpine.js para abrir/fechar, titulo e conteudo livre.

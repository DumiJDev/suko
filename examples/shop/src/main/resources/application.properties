spring.application.name=suko-shop
spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.sql.init.mode=always
spring.h2.console.enabled=false

# Templates pré-compilados (plugin gg.jte.gradle, ver build.gradle.kts): nada é compilado em runtime.
# Para iterar nos componentes com recarga, gg.jte.development-mode=true + gg.jte.template-location=src/main/jte
# servem localmente, mas são só para desenvolvimento: a pasta dos templates passa a ser código
# executável e essa configuração fica fora do âmbito do pentest.
gg.jte.use-precompiled-templates=true
gg.jte.development-mode=false

# Cookie de sessão: HttpOnly, SameSite=Lax e só por cookie (nunca ;jsessionid= na URL).
# Secure fica desligado porque a demo corre em http://localhost; atrás de HTTPS ligar
# server.servlet.session.cookie.secure=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# Location dos redirects relativo: sem isto o Tomcat constrói um URL absoluto a partir do cabeçalho Host
# do pedido (RelativeRedirectsTest).
server.tomcat.use-relative-redirects=true

# Respostas de erro sem detalhes internos (mensagens, stack traces, classes de exceção, erros de binding).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

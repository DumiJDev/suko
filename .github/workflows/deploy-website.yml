name: Deploy website

on:
  push:
    branches: ["main"]
    paths:
      - "suko-website/**"
      - "suko-components/**"
      - "suko-registry/**"
      - "suko-core/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node (for the Tailwind CLI, run via npx)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate website
        run: ./gradlew :suko-website:generateWebsite :suko-website:buildTailwindCss --console=plain

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: suko-website/build/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

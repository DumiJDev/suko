name: Example shop

# Testa a loja de exemplo (examples/shop): build separado (Spring Boot + H2) que usa o
# plugin io.suko.lang via includeBuild("../.."). Não publica nada.
on:
  push:
    branches: ["main"]
    paths:
      - "examples/shop/**"
      - "suko-api/**"
      - "suko-core/**"
      - "suko-jte/**"
      - "suko-gradle-plugin/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/shop.yml"
  pull_request:
    paths:
      - "examples/shop/**"
      - "suko-api/**"
      - "suko-core/**"
      - "suko-jte/**"
      - "suko-gradle-plugin/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/shop.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test the shop
        run: ./gradlew -p examples/shop test --console=plain
